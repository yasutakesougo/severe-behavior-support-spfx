<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHELL-UX-7 browser smoke</title>
    <style>
      html,
      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", sans-serif;
        background: #f3f2f1;
      }
      .appShell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }
      .skipLink {
        position: absolute;
        left: -999px;
      }
      .skipLink:focus {
        left: 8px;
        top: 8px;
        z-index: 10;
        background: #fff;
        padding: 8px;
      }
      .demoBanner {
        background: #fff4ce;
        border-bottom: 1px solid #f3d459;
        padding: 8px 16px;
        font-weight: 600;
      }
      .shellHeader {
        background: #fff;
        padding: 12px 16px;
        border-bottom: 1px solid #edebe9;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }
      .brandRow {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .productName {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
      }
      .shellNav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 16px;
        background: #faf9f8;
        border-bottom: 1px solid #edebe9;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }
      .navButton {
        border: 1px solid #8a8886;
        background: #fff;
        padding: 6px 12px;
        min-height: 2.5rem;
        min-width: 4.5rem;
        cursor: pointer;
      }
      .navButtonSelected {
        border-color: #03787c;
        background: #deecf9;
        font-weight: 700;
      }
      .navButton:focus,
      .destinationHeading:focus {
        outline: 2px solid #03787c;
        outline-offset: 2px;
      }
      .shellMain {
        padding: 16px;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        overflow-wrap: anywhere;
      }
      .destinationPlaceholder {
        background: #faf9f8;
        border: 1px dashed #a19f9d;
        padding: 16px;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }
      .destinationHeading {
        margin: 0 0 0.65rem;
        font-size: 1.25rem;
      }
      .destinationBody {
        margin: 0 0 0.5rem;
      }
      .destinationNote {
        margin: 0;
        font-weight: 600;
      }
      .readyRegion {
        background: #fff;
        border: 1px solid #edebe9;
        padding: 16px;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        overflow-wrap: anywhere;
      }
      @media (max-width: 768px) {
        .brandRow {
          flex-direction: column;
          align-items: flex-start;
        }
        .navButton {
          flex: 1 1 calc(33% - 0.5rem);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./smoke-bundle.js"></script>
  </body>
</html>
