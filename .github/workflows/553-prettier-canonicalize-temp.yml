name: 553 Prettier Canonicalize Temp

on:
  push:
    branches:
      - feat/sbs-mgmt-loop-b-553

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sbs-mgmt-loop-b-553
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Canonicalize only #553 domain source
        run: npx prettier --write src/domain/support-plan-revision.ts
      - name: Remove temporary workflow and commit canonical source
        run: |
          rm .github/workflows/553-prettier-canonicalize-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/domain/support-plan-revision.ts .github/workflows/553-prettier-canonicalize-temp.yml
          git diff --cached --check
          git commit -m "style: canonicalize #553 domain source"
          git push origin HEAD:feat/sbs-mgmt-loop-b-553
