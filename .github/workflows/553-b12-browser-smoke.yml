name: 553 B12 Browser Smoke

on:
  push:
    branches:
      - feat/sbs-mgmt-loop-b-553
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  b12-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: "Install SPFx dependencies for #554 browser acceptance"
        working-directory: spfx
        run: npm ci
      - name: "Install Japanese fonts for #554 browser acceptance"
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install isolated browser smoke runtime
        run: npm install --prefix /tmp --no-save puppeteer-core esbuild sass react@17.0.1 react-dom@17.0.1
      - name: Resolve isolated runtime package entries
        run: |
          PUPPETEER_PATH=$(node -e "console.log(require.resolve('puppeteer-core', { paths: ['/tmp'] }))")
          ESBUILD_PATH=$(node -e "console.log(require.resolve('esbuild', { paths: ['/tmp'] }))")
          SASS_PATH=$(node -e "console.log(require.resolve('sass', { paths: ['/tmp'] }))")
          echo "SBS_MGMT_LOOP_B_PUPPETEER_PATH=$PUPPETEER_PATH" >> "$GITHUB_ENV"
          echo "SBS_MGMT_LOOP_B_ESBUILD_PATH=$ESBUILD_PATH" >> "$GITHUB_ENV"
          echo "SBS_MGMT_LOOP_B_SASS_PATH=$SASS_PATH" >> "$GITHUB_ENV"
          echo "SBS_MGMT_LOOP_B_NODE_PATH=/tmp/node_modules" >> "$GITHUB_ENV"
      - name: Run B12 desktop + mobile browser acceptance
        env:
          SBS_MGMT_LOOP_B_ARTIFACTS_DIR: /tmp/sbs-mgmt-loop-b-browser-smoke
        run: node spfx/smoke/sbs-mgmt-loop-b/run-smoke.mjs
      - name: "Run #554 Management Home browser acceptance"
        env:
          SPML_PUPPETEER_PATH: ${{ env.SBS_MGMT_LOOP_B_PUPPETEER_PATH }}
          SPML_ESBUILD_PATH: ${{ env.SBS_MGMT_LOOP_B_ESBUILD_PATH }}
          SPML_SASS_PATH: ${{ env.SBS_MGMT_LOOP_B_SASS_PATH }}
          SPML_CHROME_PATH: /usr/bin/google-chrome
          SPML_ARTIFACTS_DIR: /tmp/554-management-home-browser-smoke
        run: |
          set +e
          node spfx/smoke/support-plan-management-list-demo-1/run-smoke.mjs
          set -e
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const artifactsDir = process.env.SPML_ARTIFACTS_DIR;
          if (!artifactsDir) throw new Error("SPML_ARTIFACTS_DIR missing");
          const reportPath = path.join(artifactsDir, "smoke-report.json");
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const required = [
            "management-home-1280",
            "management-home-390",
            "management-home-unavailable",
            "management-home-mismatch",
          ];
          const selected = required.map((name) => {
            const item = report.checks.find((check) => check.name === name);
            if (!item) throw new Error(`missing #554 RBA case: ${name}`);
            return {
              name,
              pass: item.pass === true,
              overflow: item.found?.overflow ?? null,
              unavailable: item.found?.unavailable ?? null,
              pageErrors: item.pageErrors ?? [],
            };
          });
          const allPass = selected.every(
            (item) => item.pass && item.overflow === false && item.pageErrors.length === 0,
          );
          const dedicated = {
            unit: "SBS-MGMT-HOME-C",
            acceptance: "RBA-1280-390",
            allPass,
            sourceRunnerAllPass: report.allPass,
            cases: selected,
          };
          fs.writeFileSync(
            path.join(artifactsDir, "management-home-rba-report.json"),
            JSON.stringify(dedicated, null, 2),
          );
          console.log(JSON.stringify(dedicated, null, 2));
          if (!allPass) process.exit(1);
          NODE
      - name: Upload B12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbs-mgmt-loop-b-b12-browser-smoke
          path: /tmp/sbs-mgmt-loop-b-browser-smoke
          if-no-files-found: error
      - name: "Upload #554 Management Home evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 554-management-home-browser-smoke
          path: /tmp/554-management-home-browser-smoke
          if-no-files-found: error
