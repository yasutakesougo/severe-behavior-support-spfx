name: 553 B12 Browser Smoke

on:
  push:
    branches:
      - feat/sbs-mgmt-loop-b-553
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  b12-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Install isolated browser smoke runtime
        run: npm install --prefix /tmp --no-save puppeteer-core esbuild sass
      - name: Run B12 desktop + mobile browser acceptance
        env:
          SBS_MGMT_LOOP_B_ARTIFACTS_DIR: /tmp/sbs-mgmt-loop-b-browser-smoke
        run: node spfx/smoke/sbs-mgmt-loop-b/run-smoke.mjs
      - name: Upload B12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbs-mgmt-loop-b-b12-browser-smoke
          path: /tmp/sbs-mgmt-loop-b-browser-smoke
          if-no-files-found: error
