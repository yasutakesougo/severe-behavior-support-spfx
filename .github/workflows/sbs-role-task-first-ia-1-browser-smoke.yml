name: SBS Role Task First IA Browser Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "spfx/src/shell/**"
      - "spfx/src/webparts/scaffoldShellWebPart/**"
      - "spfx/smoke/sbs-role-task-first-ia-1/**"
      - ".github/workflows/sbs-role-task-first-ia-1-browser-smoke.yml"

permissions:
  contents: read

jobs:
  role-task-first-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Install isolated browser smoke runtime
        run: npm install --prefix /tmp --no-save puppeteer-core esbuild sass react@17.0.1 react-dom@17.0.1
      - name: Resolve isolated runtime package entries
        run: |
          PUPPETEER_PATH=$(node -e "console.log(require.resolve('puppeteer-core', { paths: ['/tmp'] }))")
          ESBUILD_PATH=$(node -e "console.log(require.resolve('esbuild', { paths: ['/tmp'] }))")
          SASS_PATH=$(node -e "console.log(require.resolve('sass', { paths: ['/tmp'] }))")
          echo "SBS_ROLE_TASK_IA_PUPPETEER_PATH=$PUPPETEER_PATH" >> "$GITHUB_ENV"
          echo "SBS_ROLE_TASK_IA_ESBUILD_PATH=$ESBUILD_PATH" >> "$GITHUB_ENV"
          echo "SBS_ROLE_TASK_IA_SASS_PATH=$SASS_PATH" >> "$GITHUB_ENV"
          echo "SBS_ROLE_TASK_IA_NODE_PATH=/tmp/node_modules" >> "$GITHUB_ENV"
      - name: Run FIELD_STAFF task-first browser smoke
        env:
          SBS_ROLE_TASK_IA_ARTIFACTS_DIR: /tmp/sbs-role-task-first-ia-browser-smoke
        run: node spfx/smoke/sbs-role-task-first-ia-1/run-smoke.mjs
      - name: Upload task-first browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbs-role-task-first-ia-1-browser-smoke
          path: /tmp/sbs-role-task-first-ia-browser-smoke
          if-no-files-found: error
