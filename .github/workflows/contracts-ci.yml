name: Contracts and Process CI

on:
  pull_request:
    paths:
      - "src/contracts/**"
      - "tests/contracts/**"
      - "src/domain/**"
      - "tests/domain/**"
      - "src/adapters/**"
      - "tests/adapters/**"
      - "src/governance/**"
      - "tests/governance/**"
      - "docs/architecture/domain-reconstruction-foundation.md"
      - "docs/architecture/**"
      - "docs/process/**"
      - "docs/decisions/DEC-AI-ORG-*.md"
      - "docs/decisions/ADR-AI-ORG-*.md"
      - ".agents/**"
      - "scripts/**"
      - "tests/a11y/**"
      - "spfx/src/shell/**"
      - "spfx/src/webparts/scaffoldShellWebPart/**"
      - "spfx/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".node-version"
      - ".github/workflows/contracts-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/contracts/**"
      - "tests/contracts/**"
      - "src/domain/**"
      - "tests/domain/**"
      - "src/adapters/**"
      - "tests/adapters/**"
      - "src/governance/**"
      - "tests/governance/**"
      - "docs/architecture/domain-reconstruction-foundation.md"
      - "docs/architecture/**"
      - "docs/process/**"
      - "docs/decisions/DEC-AI-ORG-*.md"
      - "docs/decisions/ADR-AI-ORG-*.md"
      - ".agents/**"
      - "scripts/**"
      - "tests/a11y/**"
      - "spfx/src/shell/**"
      - "spfx/src/webparts/scaffoldShellWebPart/**"
      - "spfx/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".node-version"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    name: Verify contracts, skills, and scope
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify skills
        run: npm run verify:skills

      - name: Verify UI catalog
        run: npm run verify:ui-catalog

      - name: Verify UI screen templates
        run: npm run verify:ui-templates

      - name: Lint UI semantic rules
        run: npm run lint:ui-sem

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Inspect contracts and domain boundaries
        run: npm run check:contracts-boundaries

      - name: Scope check
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            export SCOPE_BASE="${{ github.event.pull_request.base.sha }}"
            export SCOPE_HEAD="${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi
            export SCOPE_BASE="$before"
            export SCOPE_HEAD="${{ github.sha }}"
          fi
          npm run check:scope

      - name: Accessibility Gate (DADS-06)
        run: npm run check:a11y

      - name: Check changed lines
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
           else
             before="${{ github.event.before }}"
             if [[ "$before" =~ ^0+$ ]]; then
               before="$(git rev-list --max-parents=0 HEAD)"
             fi
             git diff --check "$before...${{ github.sha }}"
           fi

  build-spfx-production:
    name: Build SPFx production artifact with exact basis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: spfx/package-lock.json

      - name: Install SPFx dependencies
        working-directory: spfx
        run: npm ci

      - name: Build and package with GitHub source basis
        working-directory: spfx
        env:
          B2_HARNESS_BUILD_BASIS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: Assert exact build basis checkout
        working-directory: spfx
        env:
          B2_HARNESS_BUILD_BASIS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git -C .. rev-parse HEAD)"
          test "$checkout_sha" = "$B2_HARNESS_BUILD_BASIS_SHA"

      - name: Record production artifact evidence
        working-directory: spfx
        env:
          B2_HARNESS_BUILD_BASIS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          harness_bundle="$(find sharepoint/solution/debug/ClientSideAssets -name 'lifecycle-create-test-harness-web-part_*.js' -print -quit)"
          test -n "$harness_bundle"
          {
            printf 'build_basis_sha=%s\n' "$B2_HARNESS_BUILD_BASIS_SHA"
            shasum -a 256 sharepoint/solution/severe-behavior-support-spfx-shell.sppkg
            shasum -a 256 "$harness_bundle"
            shasum -a 256 src/sbs-domain/lifecycle-cancellation-storage.bundle.js
          } | tee b2-production-artifact-sha256.txt

      - name: Upload production artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: b2-production-artifact-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            spfx/sharepoint/solution/severe-behavior-support-spfx-shell.sppkg
            spfx/sharepoint/solution/debug/ClientSideAssets/lifecycle-create-test-harness-web-part_*.js
            spfx/src/sbs-domain/lifecycle-cancellation-storage.bundle.js
            spfx/b2-production-artifact-sha256.txt
