name: Contracts and Process CI

on:
  pull_request:
    paths:
      - "src/contracts/**"
      - "tests/contracts/**"
      - "src/domain/**"
      - "tests/domain/**"
      - "docs/architecture/domain-reconstruction-foundation.md"
      - "docs/architecture/**"
      - "docs/process/**"
      - "docs/decisions/DEC-AI-ORG-*.md"
      - "docs/decisions/ADR-AI-ORG-*.md"
      - ".agents/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".node-version"
      - ".github/workflows/contracts-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/contracts/**"
      - "tests/contracts/**"
      - "src/domain/**"
      - "tests/domain/**"
      - "docs/architecture/domain-reconstruction-foundation.md"
      - "docs/architecture/**"
      - "docs/process/**"
      - "docs/decisions/DEC-AI-ORG-*.md"
      - "docs/decisions/ADR-AI-ORG-*.md"
      - ".agents/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".node-version"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    name: Verify contracts, skills, and scope
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify skills
        run: npm run verify:skills

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Inspect contracts and domain boundaries
        run: npm run check:contracts-boundaries

      - name: Scope check
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            export SCOPE_BASE="${{ github.event.pull_request.base.sha }}"
            export SCOPE_HEAD="${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi
            export SCOPE_BASE="$before"
            export SCOPE_HEAD="${{ github.sha }}"
          fi
          npm run check:scope

      - name: Check changed lines
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi
            git diff --check "$before...${{ github.sha }}"
          fi
