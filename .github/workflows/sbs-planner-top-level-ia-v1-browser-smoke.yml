name: SBS PLANNER Top-Level IA Browser Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "spfx/src/shell/ux/planner-task-navigation.ts"
      - "spfx/src/shell/ux/planner-task-navigation.test.ts"
      - "spfx/src/shell/ux/index.ts"
      - "spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.tsx"
      - "spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.module.scss"
      - "spfx/smoke/sbs-planner-top-level-ia-v1/**"
      - ".github/workflows/sbs-planner-top-level-ia-v1-browser-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install root verification dependencies
        run: npm ci

      - name: Verify formatting for this unit
        run: |
          npx prettier --check \
            .github/workflows/sbs-planner-top-level-ia-v1-browser-smoke.yml \
            spfx/smoke/sbs-planner-top-level-ia-v1/run-smoke.mjs \
            spfx/smoke/sbs-planner-top-level-ia-v1/smoke-entry.tsx \
            spfx/src/shell/ux/planner-task-navigation.test.ts \
            spfx/src/shell/ux/planner-task-navigation.ts \
            spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.tsx \
            spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.module.scss

      - name: Install SPFx dependencies
        working-directory: spfx
        run: npm ci

      - name: Prepare exact B2 build basis
        working-directory: spfx
        env:
          B2_HARNESS_BUILD_BASIS_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run prepare:b2-build-basis

      - name: Run SPFx unit verification
        working-directory: spfx
        run: npx heft test --clean

      - name: Install rendered-smoke dependencies
        working-directory: /tmp
        run: npm install puppeteer-core@24 esbuild@0.25 sass --no-save

      - name: Run PLANNER Top-Level rendered smoke
        env:
          PLANNER_TL_ARTIFACTS_DIR: ${{ runner.temp }}/sbs-planner-top-level-ia-v1
        run: node spfx/smoke/sbs-planner-top-level-ia-v1/run-smoke.mjs
