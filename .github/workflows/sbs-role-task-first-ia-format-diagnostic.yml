name: SBS Role Task First IA Format Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "spfx/smoke/sbs-role-task-first-ia-1/run-smoke.mjs"
      - "spfx/src/shell/ux/field-staff-task-navigation.ts"
      - "spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.module.scss"
      - "spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.tsx"
      - ".github/workflows/sbs-role-task-first-ia-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier in runner only
        run: |
          npx prettier --write \
            spfx/smoke/sbs-role-task-first-ia-1/run-smoke.mjs \
            spfx/src/shell/ux/field-staff-task-navigation.ts \
            spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.module.scss \
            spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.tsx
      - name: Print exact formatting patch
        run: |
          git diff --no-color -- \
            spfx/smoke/sbs-role-task-first-ia-1/run-smoke.mjs \
            spfx/src/shell/ux/field-staff-task-navigation.ts \
            spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.module.scss \
            spfx/src/webparts/scaffoldShellWebPart/components/ScaffoldShell.tsx
