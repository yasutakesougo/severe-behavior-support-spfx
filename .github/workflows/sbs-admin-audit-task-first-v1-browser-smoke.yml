name: SBS ADMIN AUDIT Task-First V1 Browser Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "spfx/src/shell/ux/admin-audit-task-navigation.ts"
      - "spfx/src/shell/ux/admin-audit-task-navigation.test.ts"
      - "spfx/src/shell/ux/AppShellChrome.tsx"
      - "spfx/src/shell/ux/AppShellChrome.test.tsx"
      - "spfx/src/webparts/scaffoldShellWebPart/**"
      - "spfx/smoke/sbs-admin-audit-task-first-v1/**"
      - ".github/workflows/sbs-admin-audit-task-first-v1-browser-smoke.yml"

permissions:
  contents: read

jobs:
  admin-audit-task-first-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      # AC-AA-TF-26: checkout the PR exact head (not the merge ref).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checked-out HEAD equals PR exact head
        run: |
          EXACT_HEAD="${{ github.event.pull_request.head.sha }}"
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "exact_head=$EXACT_HEAD"
          echo "checked_out=$CHECKED_OUT"
          test "$CHECKED_OUT" = "$EXACT_HEAD"
      # ubuntu-latest lacks CJK fonts; install Noto CJK so
      # headless Chrome screenshots render Japanese glyphs.
      - name: Install Japanese fonts for rendered evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          sudo fc-cache -f -v
          echo "=== Japanese font families (fc-list :lang=ja) ==="
          fc-list :lang=ja family | sort -u | head -40
          test -n "$(fc-list :lang=ja family | head -1)"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
        working-directory: spfx
      - name: Install isolated browser smoke runtime
        run: npm install --prefix /tmp --no-save puppeteer-core esbuild sass react@17.0.1 react-dom@17.0.1
      - name: Resolve isolated runtime package entries
        run: |
          PUPPETEER_PATH=$(node -e "console.log(require.resolve('puppeteer-core', { paths: ['/tmp'] }))")
          ESBUILD_PATH=$(node -e "console.log(require.resolve('esbuild', { paths: ['/tmp'] }))")
          SASS_PATH=$(node -e "console.log(require.resolve('sass', { paths: ['/tmp'] }))")
          echo "SBS_ADMIN_AUDIT_TF_PUPPETEER_PATH=$PUPPETEER_PATH" >> "$GITHUB_ENV"
          echo "SBS_ADMIN_AUDIT_TF_ESBUILD_PATH=$ESBUILD_PATH" >> "$GITHUB_ENV"
          echo "SBS_ADMIN_AUDIT_TF_SASS_PATH=$SASS_PATH" >> "$GITHUB_ENV"
          echo "SBS_ADMIN_AUDIT_TF_NODE_PATH=/tmp/node_modules" >> "$GITHUB_ENV"
      - name: Run ADMIN_AUDIT Task-First browser smoke
        env:
          SBS_ADMIN_AUDIT_TF_ARTIFACTS_DIR: /tmp/sbs-admin-audit-task-first-v1-browser-smoke
          SBS_ADMIN_AUDIT_TF_IMPLEMENTATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node spfx/smoke/sbs-admin-audit-task-first-v1/run-smoke.mjs
      - name: Upload ADMIN_AUDIT Task-First browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbs-admin-audit-task-first-v1-browser-smoke
          path: /tmp/sbs-admin-audit-task-first-v1-browser-smoke
          if-no-files-found: error
