name: 553 B2 Connect Temp

on:
  push:
    branches:
      - feat/sbs-mgmt-loop-b-553

permissions:
  contents: write

jobs:
  connect-b2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sbs-mgmt-loop-b-553
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Generate narrow canonical revision bridge
        run: |
          npx esbuild src/domain/support-plan-revision-spfx-entry.ts \
            --bundle --format=cjs --target=es2015 --platform=neutral \
            --outfile=spfx/src/sbs-domain/support-plan-revision.bundle.js
      - name: Connect current Review completion to existing next-version section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('spfx/src/shell/users/SupportPlan.tsx')
          text = path.read_text()

          old = '''import { labelForProcedureRecordResult } from "../procedure/procedure-copy";'''
          new = '''import type { SyntheticCapturedReview } from "../monitoring/review-outcome-capture";\nimport { labelForProcedureRecordResult } from "../procedure/procedure-copy";'''
          if old not in text:
              raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)

          old = '''import type { ShellSupportPlanPresentation } from "./support-plan-types";'''
          new = '''import {\n  EMPTY_SUPPORT_PLAN_REVISION_SESSION,\n  startSyntheticPlanningPcRevision,\n  type SupportPlanRevisionSession,\n} from "./support-plan-revision-start";\nimport type { ShellSupportPlanPresentation } from "./support-plan-types";'''
          if old not in text:
              raise SystemExit('revision import anchor missing')
          text = text.replace(old, new, 1)

          old = '''  const [selectedVersion, setSelectedVersion] = React.useState(currentVersion);'''
          new = '''  const [selectedVersion, setSelectedVersion] = React.useState(currentVersion);\n  const [capturedReview, setCapturedReview] = React.useState<SyntheticCapturedReview | null>(null);\n  const [revisionSession, setRevisionSession] = React.useState<SupportPlanRevisionSession>(\n    EMPTY_SUPPORT_PLAN_REVISION_SESSION,\n  );\n  const [revisionError, setRevisionError] = React.useState<string | null>(null);'''
          if old not in text:
              raise SystemExit('state anchor missing')
          text = text.replace(old, new, 1)

          old = '''              procedureLabelContext={{\n                userId: presentation.userId,\n                planId,\n                currentVersion,\n                currentProcedures,\n              }}\n            />'''
          new = '''              procedureLabelContext={{\n                userId: presentation.userId,\n                planId,\n                currentVersion,\n                currentProcedures,\n              }}\n              onCapturedReviewChange={setCapturedReview}\n            />'''
          if old not in text:
              raise SystemExit('MonitoringView anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''  const nextVersionBlock = ('''
          if anchor not in text:
              raise SystemExit('next-version anchor missing')
          pre = '''  const revisionDraft = revisionSession.drafts[0] ?? null;\n  const revisionEligible =\n    planningPc &&\n    selectedVersion === currentVersion &&\n    capturedReview?.outcome.decision === "CHANGE_REQUIRED" &&\n    capturedReview.decisionReason !== null &&\n    capturedReview.decisionReason.reason.trim().length > 0 &&\n    capturedReview.outcome.UserId === presentation.userId &&\n    capturedReview.outcome.planId === planId &&\n    capturedReview.outcome.planVersion === currentVersion;\n\n  const handleRevisionStart = (): void => {\n    if (!revisionEligible || capturedReview === null) {\n      setRevisionError("現在の見直し結果と計画版を確認してください。");\n      return;\n    }\n    const result = startSyntheticPlanningPcRevision({\n      presentation,\n      capturedReview,\n      session: revisionSession,\n      actor: "planning-pc-synthetic-staff",\n      actionAt: new Date().toISOString(),\n    });\n    if (result.status === "STARTED" || result.status === "ALREADY_STARTED") {\n      setRevisionSession({ intents: [result.intent], drafts: [result.draft] });\n      setRevisionError(null);\n      return;\n    }\n    setRevisionError("変更内容の下書きを開始できませんでした。元の版と見直し結果を確認してください。");\n  };\n\n'''
          text = text.replace(anchor, pre + anchor, 1)

          old = '''      {adminRead ? null : (\n        <button\n          type="button"\n          className={styles.mutationButton}\n          disabled\n          aria-disabled="true"\n          data-demo-ux="support-plan-mutation-button"\n          data-review-new-version="create-cta"\n          data-sbs-action="tertiary"\n        >\n          {SUPPORT_PLAN_NEXT_VERSION_CTA}\n        </button>\n      )}'''
          new = '''      {planningPc && capturedReview ? (\n        <div data-sbs-mgmt-loop-b-review="true">\n          <p data-sbs-mgmt-loop-b-decision={capturedReview.outcome.decision}>\n            見直し結果: {capturedReview.outcome.decision === "CHANGE_REQUIRED" ? "変更が必要" : "変更なし"}\n          </p>\n          {capturedReview.decisionReason ? (\n            <p data-sbs-mgmt-loop-b-reason="true">判断理由: {capturedReview.decisionReason.reason}</p>\n          ) : null}\n        </div>\n      ) : null}\n      {revisionDraft ? (\n        <div role="status" data-sbs-mgmt-loop-b-draft="true">\n          <p>変更内容の下書き: 版 {revisionDraft.candidate.version}</p>\n          <p>元の版: {revisionDraft.reviewBinding.reviewedPlanVersion}（変更しない）</p>\n          <p>状態: 下書き / 本番未保存</p>\n        </div>\n      ) : revisionEligible && !adminRead ? (\n        <button\n          type="button"\n          className={styles.mutationButton}\n          onClick={handleRevisionStart}\n          data-demo-ux="support-plan-mutation-button"\n          data-review-new-version="create-cta"\n          data-sbs-mgmt-loop-b-action="start-revision"\n          data-sbs-action="primary"\n        >\n          変更内容の作成を始める\n        </button>\n      ) : adminRead ? null : (\n        <button\n          type="button"\n          className={styles.mutationButton}\n          disabled\n          aria-disabled="true"\n          data-demo-ux="support-plan-mutation-button"\n          data-review-new-version="create-cta"\n          data-sbs-action="tertiary"\n        >\n          {SUPPORT_PLAN_NEXT_VERSION_CTA}\n        </button>\n      )}\n      <p className={styles.sectionHint} data-sbs-mgmt-loop-b-boundary="true">\n        本番には保存されていません\n      </p>\n      {revisionError ? (\n        <p role="alert" className={styles.sectionHint} data-sbs-mgmt-loop-b-error="true">\n          {revisionError}\n        </p>\n      ) : null}'''
          if old not in text:
              raise SystemExit('disabled CTA anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Canonical formatting
        run: |
          npx prettier --write \
            src/domain/support-plan-revision-spfx-entry.ts \
            spfx/src/sbs-domain/support-plan-revision.bundle.js \
            spfx/src/sbs-domain/support-plan-revision.bundle.d.ts \
            spfx/src/shell/monitoring/MonitoringView.tsx \
            spfx/src/shell/users/support-plan-revision-start.ts \
            spfx/src/shell/users/SupportPlan.tsx
      - name: Focused root verification
        run: |
          npm run format:check
          npm run typecheck
          npm test -- --test-name-pattern='SBS-MGMT-LOOP-B|support plan revision'
      - name: Commit B2 and remove temporary workflow
        run: |
          rm .github/workflows/553-b2-connect-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/support-plan-revision-spfx-entry.ts spfx/src/sbs-domain/support-plan-revision.bundle.js spfx/src/sbs-domain/support-plan-revision.bundle.d.ts spfx/src/shell/monitoring/MonitoringView.tsx spfx/src/shell/users/support-plan-revision-start.ts spfx/src/shell/users/SupportPlan.tsx .github/workflows/553-b2-connect-temp.yml
          git commit -m "feat: connect #553 review outcome to Planning-PC revision start"
          git push origin HEAD:feat/sbs-mgmt-loop-b-553
