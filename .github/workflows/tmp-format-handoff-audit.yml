name: Temporary format Handoff audit files

on:
  push:
    branches:
      - codex/handoff-audit-event-impl2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/handoff-audit-event-impl2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx prettier --write src/domain/handoff-audit-event.ts tests/contracts/handoff-audit-event-contract.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/handoff-audit-event.ts tests/contracts/handoff-audit-event-contract.test.ts
          git commit -m "style: apply Prettier to Handoff audit files"
          git push origin HEAD:codex/handoff-audit-event-impl2
